defaults:
  - model: conformer_baseline
  - metrics: inference
  - datasets: all_eval
  - dataloader: conformer_dataloader
  - transforms: conformer
  - decoders: two_decoders
  - _self_

text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

dataloader:
  batch_size: 1

inferencer:
  device_tensors: ["spectrogram"]
  device: auto
  save_path: ??? # Required: output directory, relative to data/saved/ or absolute.
  seed: 1
  from_pretrained: ??? # Required: checkpoint path matching the model and text encoder.
