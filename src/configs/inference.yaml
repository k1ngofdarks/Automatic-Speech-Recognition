defaults:
  - model: conformer_baseline
  - metrics: example
  - datasets: other_eval
  - dataloader: conformer_dataloader
  - transforms: conformer
  - decoders: greedy
  - _self_

text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

dataloader:
  batch_size: 1

inferencer:
  device_tensors: ["spectrogram"]
  device: auto
  save_path: "path/to/save/inference/results"
  seed: 1
  from_pretrained: paths/to/your/pretrained/model.pth
