defaults:
  - baseline
  - _self_

train:
  wave_transforms:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: src.transforms.wav_augs.AddNoise
        min_snr: 20.0
        max_snr: 30.0
        p: 0.5
  spectrogram_transforms:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: src.transforms.spec_augs.LogMelNormalization
        eps: 1.0e-5
