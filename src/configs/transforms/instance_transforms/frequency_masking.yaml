defaults:
  - baseline
  - _self_

train:
  spectrogram_transforms:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: src.transforms.spec_augs.LogMelNormalization
        eps: 1.0e-5
      - _target_: torchaudio.transforms.FrequencyMasking
        freq_mask_param: 24
        iid_masks: true
