train: [] # metrics that are calculated during training
inference: # metrics that are calculated during inference (eval)
  - _target_: src.metrics.ArgmaxCERMetric
    name: "CER_(Beam)" # it is better to avoid spaces in names
    decoder_key: beam # Key in config.decoders and batch["predictions"], e.g. "greedy" or "beam"
  - _target_: src.metrics.ArgmaxWERMetric
    name: "WER_(Beam)"
    decoder_key: beam
  - _target_: src.metrics.CorpusCERMetric
    name: "CER_Corpus(Beam)"
    decoder_key: beam
  - _target_: src.metrics.CorpusWERMetric
    name: "WER_Corpus(Beam)"
    decoder_key: beam
